; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
	crankyoldgit/IRremoteESP8266@^2.9.0
	makuna/NeoPixelBus@^2.8.4

; Upload port is intentionally not pinned to a developer-specific device.
; Disable IR protocols by default, then enable NEC plus unknown-code discovery.
build_flags =
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_HASH=true

monitor_speed = 115200
