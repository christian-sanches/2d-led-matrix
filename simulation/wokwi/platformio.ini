[platformio]
default_envs = esp32dev
src_dir = src

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../../lib
lib_deps =
	crankyoldgit/IRremoteESP8266@^2.9.0
	makuna/NeoPixelBus@^2.8.4
build_flags =
	-I../../include
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_NEC=true
	-DDECODE_HASH=true
monitor_speed = 115200
